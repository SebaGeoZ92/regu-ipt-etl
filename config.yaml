# ─────────────────────────────────────────────────────────────
# regu-ipt-etl · configuración
# ─────────────────────────────────────────────────────────────
arcgis:
  base_url: https://geoide.minvu.cl/server/rest/services
  folders: [IPT]
  timeout: 90          # segundos por request
  retries: 6           # reintentos ante 5xx / 429 / caídas del Web Adaptor
  backoff: 2.0         # backoff exponencial entre reintentos
  pause_s: 0.5         # pausa de cortesía entre requests
  geometry_precision: 7

paths:
  raw: data/raw        # caché de descargas (una vez bajado, no se vuelve a pedir)
  out: data/out
  comunas: data/base/comunas_bcn/comunas.shp   # BCN SIIT, División comunal (346 comunas, EPSG:3857)

comunas:
  layer: null          # nombre de capa si el archivo tiene varias
  field_cut: cod_comuna    # entero de 4-5 dígitos; se normaliza a 5 (9101 -> 09101)
  field_nombre: Comuna
  field_region: Region      # ej. 'Región de La Araucanía'

crs:
  trabajo: ESRI:102033 # overlays en métrico y equivalente de área; sirve de Arica a Magallanes
  area: ESRI:102033    # South America Albers Equal Area, para áreas
  salida: EPSG:4326

build:
  grid_m: 0            # snapping de overlays en metros (0 = precisión flotante exacta; probar 0.001 si GEOS reclama topología)
  min_area_m2: 1.0     # descarta astillas menores a esto
  incluir_attrs_raw_geojson: false   # el GPKG siempre las lleva
  precision_geojson: 6

# Tipo de capa según su NOMBRE, evaluado ANTES que service_rules (salvo servicios IGNORAR).
# Solo patrones inequívocos: dentro de servicios PRI/PRMS hay capas de riesgo, LU o vialidad.
layer_rules_prioritarias:
  - {pattern: "(riesgo|patrimon|zona[_ ]?t[ií]pica|vialid)", tipo: AFECTACION}
  - {pattern: "l[ií]mites?[_ ]?urbanos?", tipo: LU}

# Tipo de capa según el SERVICIO (se evalúa antes que layer_rules; gana la primera coincidencia).
# pri_default: subclase para zonas PRI/PRM cuya sigla no calza con pri_subclase (E, R o U).
service_rules:
  - {pattern: "/IPT_AREA_RIESGO$", tipo: AFECTACION}
  - {pattern: "/Patrimonio$", tipo: AFECTACION}
  - {pattern: "/Limites_Urbanos$", tipo: LU}
  - {pattern: "/PRDU_", tipo: IGNORAR}          # Plan Regional de Desarrollo Urbano: indicativo, no fija normas urbanísticas
  - {pattern: "/PRC_Nuble$", tipo: IGNORAR}     # duplicado exacto de PRC_Ñuble (25/25 capas idénticas, verificado 28-sep-2026; ver CLAUDE.md)
  - {pattern: "/PRI_Extension_urbana$", tipo: PRI, pri_default: E}
  - {pattern: "/PRI_Area_Rural$", tipo: PRI, pri_default: R}
  - {pattern: "/(PRMS|PRMC|PREMVAL)$", tipo: PRM}
  - {pattern: "/PRI_", tipo: PRI}

# Capas PRI que solo son el contorno del área normada (sin zonificación propia): fuente PRI_ENV, clase R1,
# después de toda la zonificación PRI. Regex sobre "<servicio>/<nombre de capa>".
pri_envolvente:
  - "/PRI_Area_Rural/"                                 # Límite área rural PRI
  - "/PRI_Araucan[ií]a/Unidad Territorial [A-Z]$"      # duplican la zonificación del PRI Villarrica-Pucón

# Tipo de capa según su NOMBRE (servicios no cubiertos arriba, p.ej. PRC_<Región>). Se evalúa en orden; gana la primera coincidencia.
layer_rules:
  - {pattern: "(riesgo|patrimon|inund|remoci|tsunami|zona_?t[ií]pica|afecta|vialidad)", tipo: AFECTACION}
  # Capas superpuestas dentro de PRC: zonas no edificables, inmuebles/zonas de conservación histórica,
  # áreas de riesgo (AR) y restricciones. Si entran como PRC extienden U1 fuera de la zonificación.
  - {pattern: "((^|[_ \\-])(ZNE|ICH|ZCH|AR)([_ \\-]|$)|restricci)", tipo: AFECTACION}
  - {pattern: "^(plano[_ ])?(seccional|ps)[_ ]", tipo: SECCIONAL}   # "Plano_Seccional_..." (Negrete, Puente Alto)
  - {pattern: "(l[ií]mite[_ ]?urbano|^lu[_ ])", tipo: LU}
  - {pattern: "^(prms|prm|metropolitano)", tipo: PRM}
  - {pattern: "^(pri|intercomunal)", tipo: PRI}
  - {pattern: "^(prc|plan[_ ]regulador)", tipo: PRC}
  - {pattern: ".*", tipo: IGNORAR}

# Correcciones manuales por capa (ganan sobre todo): "<servicio>/<id_capa>": TIPO
#  "IPT/PRC_Atacama/8": AFECTACION
overrides:
  "IPT/PRC_Valparaíso/71": PRC          # IPT_PRC_05_Los_Andes: zonificación vigente (D. 10, DO 22-01-2026)
  "IPT/PRC_Valparaíso/68": AFECTACION   # PRC_Los_Andes_R: solo 'Área de Riesgo' (OGUC 2.1.17)

zone_fields: [ZONA, ZONIFICACION, ZONIFICACI, NOM_ZONA, NOMBRE_ZONA, ZONA_PRC, COD_ZONA, SIGLA, CODIGO, ZONAS, NOMBRE]
zone_desc_fields: [DESCRIPCION, DESCRIPCIO, DESCRIP, NOMBRE_ZONA, NOM_ZONA, USO, USO_SUELO, DETALLE, OBS]
comuna_fields: [CUT, CUT_COM, COD_COMUNA, COMUNA, NOM_COMUNA, NOM_COM, NOMBRE_COM, COM]   # COM: esquema MINVU reciente (REG/COM/LOC/ZONA/NOM)
# Si comuna_fields no resuelve (p.ej. COM = "Padre de Las Casas", "Teodoro Schmitdt"), se prueba en orden:
# cada campo quitándole el prefijo (en mayúsculas sin tildes; solo se usa si lo trae), luego comuna_alias
# sobre esos mismos valores y al final el nombre de la capa.
comuna_cascada:
  - {campo: ADMIN, prefijo: "^MUNICIPALIDAD DE "}
  - {campo: NOM, prefijo: "^LIMITE URBANO DE "}
comuna_alias:   # "<valor tal como viene>": "<nombre BCN>"
  "Pitufquén": "Pitrufquén"          # IPT_AREA_RIESGO/PRC_Area_de_Riesgo
  "Puerto Saavedra": "Saavedra"      # IPT_AREA_RIESGO/PRC_Area_de_Riesgo (COM trae la localidad)

# Zonas de riesgo dentro de capas de zonificación (PRC, PRI, PRM, seccional): NO salen de la partición,
# quedan en la clase de su instrumento con riesgo=True y además se copian a afectaciones.
# Regex sobre ZONA + DESCRIPCIÓN, en mayúsculas sin tildes.
zona_riesgo: "RIESGO"
# Zonas que NO son riesgo aunque vengan en una capa de riesgo (regex sobre ZONA, en mayúsculas sin tildes).
# APP: áreas de protección (p.ej. PRC_Temuco_Areas_de_proteccion_y_riesgo mezcla APP con ARI/ARP/ARRI).
zona_riesgo_excluir: "^APP\\b"

# Afectaciones de alcance comunal (regex sobre "<servicio>/<nombre de capa>"): llevan CUT (misma cascada que
# los PRC) y solo se aplican en su comuna, como la partición. Cubre los servicios PRC_<Región> y
# IPT_AREA_RIESGO/PRC_Area_de_Riesgo. Las de PRI/PRM, Patrimonio, etc. no se filtran por comuna.
afectacion_comunal: "/PRC_"

# Tipificación manual de zonas, con prioridad sobre pri_subclase: "<ipt_nombre>|<zona>": E | U | R | AFECTACION
# ipt_nombre y zona tal como salen en capa_ipt (se comparan sin tildes, mayúsculas ni guiones).
# E/U/R solo aplican a PRI/PRM; AFECTACION saca la zona de la partición (PRI, PRM o PRC).
# PENDIENTE: lo llena el arquitecto para el PRI Lago Villarrica (zonas con revisar=True).
zone_overrides: {}
#  "Villarrica Pucon|Zona de vivienda": E

# Subclase de zonas PRI/PRM (regex sobre ZONA + DESCRIPCIÓN, en mayúsculas sin tildes).
# Orden importa: E antes que U porque "extension urbana" contiene "URBAN".
pri_subclase:
  E: "(EXTENSION|\\bZEU|\\bAEU|URBANIZABLE)"
  R: "(RURAL|SILVO|AGRO|AGRIC|PROTECCION|PRESERVACION|\\bZR|\\bAR\\b|INTERES|VALOR NATURAL|RESTRICCION)"
  U: "(URBAN|CONSOLIDAD|\\bZU|\\bAU\\b)"
