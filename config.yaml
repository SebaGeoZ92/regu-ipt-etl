# ─────────────────────────────────────────────────────────────
# regu-ipt-etl · configuración
# ─────────────────────────────────────────────────────────────
arcgis:
  base_url: https://geoide.minvu.cl/server/rest/services
  folders: [IPT]
  timeout: 90          # segundos por request
  retries: 6           # reintentos ante 5xx / 429 / caídas del Web Adaptor
  backoff: 2.0         # backoff exponencial entre reintentos
  pause_s: 0.5         # pausa de cortesía entre requests
  geometry_precision: 7

paths:
  raw: data/raw        # caché de descargas (una vez bajado, no se vuelve a pedir)
  out: data/out
  comunas: data/base/comunas_bcn/comunas.shp   # BCN SIIT, División comunal (346 comunas, EPSG:3857)

comunas:
  layer: null          # nombre de capa si el archivo tiene varias
  field_cut: cod_comuna    # entero de 4-5 dígitos; se normaliza a 5 (9101 -> 09101)
  field_nombre: Comuna
  field_region: Region      # ej. 'Región de La Araucanía'

crs:
  trabajo: ESRI:102033 # overlays en métrico y equivalente de área; sirve de Arica a Magallanes
  area: ESRI:102033    # South America Albers Equal Area, para áreas
  salida: EPSG:4326

build:
  grid_m: 0            # snapping de overlays en metros (0 = precisión flotante exacta; probar 0.001 si GEOS reclama topología)
  min_area_m2: 1.0     # descarta astillas menores a esto
  incluir_attrs_raw_geojson: false   # el GPKG siempre las lleva
  precision_geojson: 6

# Tipo de capa según el SERVICIO (se evalúa antes que layer_rules; gana la primera coincidencia).
# pri_default: subclase para zonas PRI/PRM cuya sigla no calza con pri_subclase (E, R o U).
service_rules:
  - {pattern: "/IPT_AREA_RIESGO$", tipo: AFECTACION}
  - {pattern: "/Patrimonio$", tipo: AFECTACION}
  - {pattern: "/Limites_Urbanos$", tipo: LU}
  - {pattern: "/PRDU_", tipo: IGNORAR}          # Plan Regional de Desarrollo Urbano: indicativo, no fija normas urbanísticas
  - {pattern: "/PRC_Nuble$", tipo: IGNORAR}     # duplicado de PRC_Ñuble · VERIFICAR cuál está vigente
  - {pattern: "/PRI_Extension_urbana$", tipo: PRI, pri_default: E}
  - {pattern: "/PRI_Area_Rural$", tipo: PRI, pri_default: R}
  - {pattern: "/(PRMS|PRMC|PREMVAL)$", tipo: PRM}
  - {pattern: "/PRI_", tipo: PRI}

# Tipo de capa según su NOMBRE (servicios no cubiertos arriba, p.ej. PRC_<Región>). Se evalúa en orden; gana la primera coincidencia.
layer_rules:
  - {pattern: "(riesgo|patrimon|inund|remoci|tsunami|zona_?t[ií]pica|afecta|vialidad)", tipo: AFECTACION}
  - {pattern: "^(plano[_ ])?(seccional|ps)[_ ]", tipo: SECCIONAL}   # "Plano_Seccional_..." (Negrete, Puente Alto)
  - {pattern: "(l[ií]mite[_ ]?urbano|^lu[_ ])", tipo: LU}
  - {pattern: "^(prms|prm|metropolitano)", tipo: PRM}
  - {pattern: "^(pri|intercomunal)", tipo: PRI}
  - {pattern: "^(prc|plan[_ ]regulador)", tipo: PRC}
  - {pattern: ".*", tipo: IGNORAR}

# Correcciones manuales por capa (ganan sobre todo): "<servicio>/<id_capa>": TIPO
overrides: {}
#  "IPT/PRC_Atacama/8": AFECTACION

zone_fields: [ZONA, ZONIFICACION, ZONIFICACI, NOM_ZONA, NOMBRE_ZONA, ZONA_PRC, COD_ZONA, SIGLA, CODIGO, ZONAS, NOMBRE]
zone_desc_fields: [DESCRIPCION, DESCRIPCIO, DESCRIP, NOMBRE_ZONA, NOM_ZONA, USO, USO_SUELO, DETALLE, OBS]
comuna_fields: [CUT, CUT_COM, COD_COMUNA, COMUNA, NOM_COMUNA, NOM_COM, NOMBRE_COM, COM]   # COM: esquema MINVU reciente (REG/COM/LOC/ZONA/NOM)

# Subclase de zonas PRI/PRM (regex sobre ZONA + DESCRIPCIÓN, en mayúsculas sin tildes).
# Orden importa: E antes que U porque "extension urbana" contiene "URBAN".
pri_subclase:
  E: "(EXTENSION|\\bZEU|\\bAEU|URBANIZABLE)"
  R: "(RURAL|SILVO|AGRO|AGRIC|PROTECCION|PRESERVACION|\\bZR|\\bAR\\b|INTERES|VALOR NATURAL|RESTRICCION)"
  U: "(URBAN|CONSOLIDAD|\\bZU|\\bAU\\b)"
